<!doctype html><html lang="en"><head><meta charset="utf-8"><title>The Eleventh Dimension</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--pn:#0e1530;--tx:#e6e9f5;--mu:#8b93b5;--ac:#4d7cff;--vi:#9b6bff;--bd:#222b52}
:root[data-theme=light]{--bg:#f5f6fb;--pn:#fff;--tx:#14182e;--mu:#586080;--ac:#2450d6;--vi:#6a3fd6;--bd:#d5d9ea}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f5f6fb;--pn:#fff;--tx:#14182e;--mu:#586080;--ac:#2450d6;--vi:#6a3fd6;--bd:#d5d9ea}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:16px/1.65 Newsreader,Georgia,serif;padding-top:env(safe-area-inset-top,0)}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd);font-family:Inter,sans-serif}
header h1{font-size:15px;margin:0;letter-spacing:.2em;font-weight:600;background:linear-gradient(90deg,var(--ac),var(--vi));-webkit-background-clip:text;color:transparent;white-space:nowrap}
button,input,select{font:inherit;font-family:Inter,sans-serif;font-size:14px;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}button{cursor:pointer}button:hover{border-color:var(--ac)}
#q{flex:1;min-width:0}#prog{height:3px;background:linear-gradient(90deg,var(--ac),var(--vi));width:0;position:fixed;top:0;left:0;z-index:9}
#app{display:flex;min-height:calc(100% - 56px)}aside{width:300px;flex:none;border-right:1px solid var(--bd);padding:12px;overflow:auto;height:calc(100vh - 56px);position:sticky;top:56px;font-family:Inter,sans-serif;font-size:14px}
aside h4{margin:14px 0 4px;font-size:11px;letter-spacing:.15em;color:var(--mu);text-transform:uppercase}aside a{display:block;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--tx)}aside a:hover,aside a.on{background:var(--bd)}
main{flex:1;max-width:780px;margin:0 auto;padding:24px 22px 80px;min-width:0}h2{font-size:34px;line-height:1.15;margin:.2em 0}
.b{display:inline-block;font:600 11px Inter,sans-serif;padding:3px 9px;border-radius:99px;border:1px solid var(--ac);color:var(--ac)}.b.M{border-color:#2fb58a;color:#2fb58a}.b.T{border-color:var(--vi);color:var(--vi)}.b.S{border-color:#e0a030;color:#e0a030}
.eq{font:italic 20px Newsreader,serif;text-align:center;padding:14px;margin:16px 0;border:1px solid var(--bd);border-radius:10px;background:var(--pn)}
.term{border-bottom:1px dotted var(--ac);cursor:help}.card{border:1px solid var(--bd);background:var(--pn);border-radius:12px;padding:14px 16px;margin:16px 0}canvas{width:100%;max-width:520px;border-radius:10px;background:#050816;display:block;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}label{font:13px Inter,sans-serif;color:var(--mu)}input[type=range]{padding:0;accent-color:var(--ac)}.ok{color:#2fb58a}.no{color:#e0605a}
#pop{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(560px,92vw);display:none;z-index:8;box-shadow:0 8px 30px #0008}
#menu{display:none}@media(max-width:820px){#menu{display:block}aside{position:fixed;left:0;top:56px;bottom:0;background:var(--pn);z-index:6;transform:translateX(-100%);transition:.25s;height:auto}aside.open{transform:none}h2{font-size:28px}}
</style></head><body><div id="prog"></div>
<header><button id="menu" aria-label="Contents">☰</button><h1>THE ELEVENTH DIMENSION</h1><input id="q" placeholder="Search the book…" aria-label="Search"><button id="th" aria-label="Theme">◐</button></header>
<div id="app"><aside id="toc"></aside><main id="v"></main></div><div id="pop" class="card"></div>
<script>
const $=s=>document.querySelector(s);
const PT=['I · Understanding Dimensions','II · Exploring Higher Dimensions','III · String Theory','IV · The Eleventh Dimension','V · The Universe and Higher Dimensions'];
const SL={E:'Experimentally established',M:'Mathematically established',T:'Theoretical model',S:'Speculative / unresolved'};
// [part,title,status,text,equation]
const C=[
[0,'What Is a Dimension?','M','In mathematics, the dimension of a space is the number of independent coordinates needed to specify a point in it; for a vector space it is the number of vectors in a basis. In physics the same idea counts degrees of freedom: the independent quantities needed to describe a system’s configuration. Whether a mathematical dimension corresponds to a physical one is a separate, empirical question.'],
[0,'Zero-Dimensional Space','M','A point has no extent: it needs zero coordinates to be located within itself. Zero-dimensional spaces such as a single point or a discrete set of points are the building blocks for constructing higher-dimensional objects by sweeping.'],
[0,'The First Dimension','M','A line needs one coordinate x. Motion along one axis is described by a single real number changing with time, and every point has exactly two directions of travel.'],
[0,'The Second Dimension','M','A plane needs two coordinates (x, y). Area measures extent; flat-world thought experiments, such as Abbott’s Flatland, help us reason about what dimensions mean without being physical claims.'],
[0,'The Third Dimension','E','Everyday space is observed to have three large spatial dimensions, described by Cartesian coordinates (x, y, z), with volume as the measure of extent. This is an experimentally established fact at accessible scales.'],
[0,'The Fourth Dimension','E','Two different ideas share the name. A fourth spatial dimension is a mathematical construct. Time as a fourth dimension is physical: in special relativity, events live in Minkowski spacetime, where time enters the geometry with a sign opposite to space in the invariant interval (sign convention varies by author). Special relativity is extremely well tested; a fourth spatial dimension has no experimental support.','s² = −c²Δt² + Δx² + Δy² + Δz²'],
[1,'Visualizing Higher Dimensions','M','We perceive three spatial dimensions, so higher-dimensional objects are studied through projections (shadows), cross-sections, and algebra. Every visualization loses information; a projection is not the object. Analogy: a 3D cube’s shadow on paper is a flat figure with overlapping edges.'],
[1,'The Tesseract','M','The tesseract (4-cube) is built by sweeping a cube through a fourth direction. It has 16 vertices, 32 edges, 24 square faces and 8 cubic cells. Four-dimensional rotations happen in planes (six of them: XY, XZ, YZ, XW, YW, ZW), not around axes. Try the laboratory below.','Vertices = 2ⁿ,  Edges = n·2ⁿ⁻¹'],
[1,'Five and Six Dimensions','M','Mathematically, ℝⁿ is defined for any n by n real coordinates. Extra coordinates are routinely used for parameters: for example, a robot arm with six joints has a six-dimensional configuration space. Such “dimensions” are abstract degrees of freedom, not necessarily spatial.'],
[1,'Seven to Ten Dimensions','M','Higher-dimensional geometry includes spheres Sⁿ, tori, and manifolds. Their relevance to physics comes through string theory, whose consistency requires ten spacetime dimensions (nine space plus one time). Those requirements are theoretical, not observed.'],
[2,'Introduction to String Theory','T','String theory is a candidate framework for quantum gravity in which fundamental objects are one-dimensional strings rather than points. Different vibrational modes of a string would appear as different particles, including a massless spin-2 state that matches the graviton. Strings can be open or closed. String theory has no experimental confirmation.'],
[2,'Superstring Theory','T','Adding supersymmetry removes the tachyon of the bosonic string and brings in fermions. Five consistent ten-dimensional superstring theories exist: Type I, Type IIA, Type IIB, heterotic SO(32) and heterotic E₈×E₈. Supersymmetry has not been observed experimentally.'],
[2,'Compactified Dimensions','T','If extra spatial dimensions exist, they must be unobservably small or otherwise hidden. In Kaluza–Klein theory (Kaluza 1921, Klein 1926) a dimension curled into a circle of radius R produces a tower of particle modes with masses inversely proportional to R. The small R is what keeps them out of reach of current experiments.','mₙ = nħ/(Rc),  n = 0, 1, 2, …'],
[2,'Calabi–Yau Manifolds','M','Calabi–Yau manifolds are compact complex Kähler manifolds with vanishing first Chern class (Ricci-flat metrics). In 1985 Candelas, Horowitz, Strominger and Witten showed that compactifying the heterotic string on a Calabi–Yau threefold (six real dimensions) preserves N=1 supersymmetry in four dimensions. Any 3D picture of one is only an artistic projection.'],
[3,'What Is M-Theory?','T','In 1995 Edward Witten proposed that the five superstring theories are connected by dualities and are limits of a single eleven-dimensional theory, called M-theory. It is not yet fully formulated; only its low-energy limit and various corners are well understood.','R₁₁ ≈ g_s ℓ_s  (Type IIA, up to convention-dependent factors)'],
[3,'Why Eleven Dimensions?','T','Eleven is the maximum spacetime dimension for a supergravity theory with a single graviton, and eleven-dimensional supergravity was constructed by Cremmer, Julia and Scherk in 1978. At strong coupling Type IIA string theory acquires an extra circle, which exposes the eleventh dimension. What the complete underlying theory is remains unresolved.'],
[3,'M-Branes','T','Branes are extended objects. M2-branes have a 2+1 dimensional worldvolume and are sources of the 3-form field of 11D supergravity; M5-branes have a 5+1 dimensional worldvolume and are their magnetic counterparts. Wrapping an M2-brane on the M-theory circle gives the fundamental string of Type IIA.'],
[3,'Strings and Branes','T','Dimensional reduction links the pictures: M-theory on a circle gives Type IIA; M-theory on a line segment gives heterotic E₈×E₈ (Hořava–Witten, 1996). D-branes, in the ten-dimensional string theories, are surfaces where open strings can end.'],
[3,'Gravity and the Eleventh Dimension','T','Eleven-dimensional supergravity contains the graviton, a gravitino and a 3-form gauge field. Its classical equations describe the low-energy limit of M-theory, but quantum gravity requires the full theory, which is not established.'],
[4,'Could Extra Dimensions Exist?','E','Torsion-balance tests find no deviation from Newtonian gravity’s inverse-square law down to scales of tens of micrometres, and collider searches at the LHC have found no signs of Kaluza–Klein states or large extra dimensions. These results constrain, but do not rule out, small extra dimensions.'],
[4,'Black Holes and Higher Dimensions','M','Higher-dimensional black-hole solutions exist in general relativity, such as Schwarzschild–Tangherlini and Myers–Perry solutions, and in dimensions above four, black rings also exist. Whether they have physical counterparts is unknown. String theory has also counted microstates for certain special black holes, which is a theoretical result.'],
[4,'Cosmology and Higher Dimensions','S','Models such as brane-world scenarios and string-inspired inflation use extra dimensions to address open cosmological questions. None have been experimentally confirmed, and current observations do not require them.'],
[4,'What We Still Do Not Know','S','Open problems include a complete formulation of M-theory, how a unique four-dimensional universe emerges from the vast landscape of compactifications, the lack of any experimental test, and a full quantum theory of gravity. Searches continue in gravity, particle colliders and cosmology.']];
const G=[['Dimension','Number of independent coordinates required to specify a point in a space.',[0]],['Spacetime','Four-dimensional arrangement of events with the Minkowski (or curved) metric.',[5]],['Tesseract','The four-dimensional hypercube: 16 vertices, 32 edges, 24 squares, 8 cubes.',[7]],['Hypercube','The n-dimensional analogue of the square and cube, with 2ⁿ vertices.',[7]],['String Theory','Framework in which fundamental objects are one-dimensional strings.',[10]],['Superstring Theory','String theory with supersymmetry, consistent in 10 dimensions.',[11]],['M-Theory','Proposed 11-dimensional theory unifying the five superstring theories.',[14]],['Compactification','Curling extra dimensions into a small compact space.',[12]],['Calabi–Yau','Compact Ricci-flat Kähler manifold used for string compactification.',[13]],['Supersymmetry','Proposed symmetry pairing bosons and fermions; not observed.',[11]],['Brane','Extended object of p spatial dimensions in string and M-theory.',[16]],['M2-brane','2+1 dimensional brane of M-theory.',[16]],['M5-brane','5+1 dimensional brane of M-theory.',[16]],['Kaluza–Klein','Theory where extra circle dimensions yield additional fields and mass towers.',[12]],['Supergravity','Supersymmetric theory of gravity; 11D is its maximal dimension.',[15,18]],['Quantum Gravity','Hoped-for quantum theory of gravity; unresolved.',[10]],['General Relativity','Einstein’s theory of gravity as curved spacetime; experimentally well tested.',[5,19]],['Quantum Mechanics','Theory of matter and energy at small scales; experimentally well tested.',[10]]];
const Q={5:{q:'In Minkowski spacetime, how does time differ from a spatial coordinate in the invariant interval?',o:['It enters with the opposite sign','It is ignored','It is always zero','It is the same as x'],a:0,w:'The interval s² = −c²Δt² + Δx² + Δy² + Δz² uses a relative minus sign for time.'},7:{q:'How many vertices does a tesseract have?',o:['8','16','24','32'],a:1,w:'2⁴ = 16. (32 is the edge count; 24 the squares.)'},12:{q:'If a compact dimension’s radius R decreases, the Kaluza–Klein mass scale…',o:['decreases','is unchanged','increases','vanishes'],a:2,w:'Masses scale as 1/R, so a smaller radius means heavier excitations.'},14:{q:'M-theory is best described as…',o:['experimentally confirmed','a proposed 11-dimensional framework, not yet fully formulated','disproved','a four-dimensional theory'],a:1,w:'It is a theoretical proposal with strong evidence from dualities but no experimental test.'},15:{q:'What is the maximum spacetime dimension for supergravity with a single graviton?',o:['10','11','12','26'],a:1,w:'Eleven; the 11D theory was constructed by Cremmer, Julia and Scherk (1978).'},19:{q:'True or false: extra dimensions have been ruled out entirely by experiments.',o:['True','False'],a:1,w:'Experiments constrain their size and form but do not exclude all small extra dimensions.'}};
const BIB=[['Witten, E. (1995). String theory dynamics in various dimensions. Nucl. Phys. B 443, 85–126.','https://doi.org/10.1016/0550-3213(95)00158-O'],['Hořava, P., Witten, E. (1996). Heterotic and Type I string dynamics from eleven dimensions. Nucl. Phys. B 460, 506–524.','https://doi.org/10.1016/0550-3213(95)00621-4'],['Cremmer, E., Julia, B., Scherk, J. (1978). Supergravity theory in 11 dimensions. Phys. Lett. B 76, 409–412.','https://doi.org/10.1016/0370-2693(78)90894-8'],['Candelas, P., Horowitz, G., Strominger, A., Witten, E. (1985). Vacuum configurations for superstrings. Nucl. Phys. B 258, 46–74.','https://doi.org/10.1016/0550-3213(85)90602-9'],['Polchinski, J. (1998). String Theory, Vols. 1–2. Cambridge University Press.',''],['Green, M., Schwarz, J., Witten, E. (1987). Superstring Theory, Vols. 1–2. Cambridge University Press.','']];
let S;try{S=JSON.parse(localStorage.getItem('ed'))}catch(e){}S=S||{done:{},bm:{},quiz:{},theme:''};
const save=()=>{try{localStorage.setItem('ed',JSON.stringify(S))}catch(e){}};
let cur=0,raf=0;const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
if(S.theme)document.documentElement.dataset.theme=S.theme;
$('#th').onclick=()=>{const l=getComputedStyle(document.body).backgroundColor=='rgb(245, 246, 251)';S.theme=l?'dark':'light';document.documentElement.dataset.theme=S.theme;save()};
$('#menu').onclick=()=>$('#toc').classList.toggle('open');
function toc(){const d=Object.keys(S.done).length;let h=`<div style="color:var(--mu)">${d}/23 chapters complete</div>`;PT.forEach((p,i)=>{h+=`<h4>${p}</h4>`;C.forEach((c,j)=>{if(c[0]==i)h+=`<a data-i="${j}" class="${j==cur?'on':''}">${S.done[j]?'✓ ':S.bm[j]?'★ ':''}${j+1}. ${c[1]}</a>`})});h+=`<h4>Reference</h4><a data-i="g">Glossary</a><a data-i="b">Bibliography</a>`;$('#toc').innerHTML=h}
$('#toc').onclick=e=>{const i=e.target.dataset.i;if(i!=null){show(i=='g'||i=='b'?i:+i);$('#toc').classList.remove('open')}};
function link(t){return G.reduce((s,g)=>s.split(g[0]).join(`§${G.indexOf(g)}§`),t).replace(/§(\d+)§/g,(m,i)=>`<span class="term" data-g="${i}">${G[i][0]}</span>`)}
function pop(i){const g=G[i],p=$('#pop');p.innerHTML=`<b>${g[0]}</b> — ${g[1]}<br><small>Chapters: ${g[2].map(n=>`<a style="color:var(--ac);cursor:pointer" data-i="${n}">${n+1}</a>`).join(', ')} · <a style="cursor:pointer" id="x">close</a></small>`;p.style.display='block';$('#x').onclick=()=>p.style.display='none';p.querySelectorAll('[data-i]').forEach(a=>a.onclick=()=>{show(+a.dataset.i);p.style.display='none'})}
document.addEventListener('click',e=>{if(e.target.dataset&&e.target.dataset.g)pop(+e.target.dataset.g)});
function show(i){cancelAnimationFrame(raf);cur=i;const v=$('#v');scrollTo(0,0);
 if(i=='g'){v.innerHTML=`<h2>Glossary</h2>`+G.map((g,k)=>`<div class="card"><b>${g[0]}</b><br>${g[1]}<br><small>Chapters: ${g[2].map(n=>n+1).join(', ')}</small></div>`).join('');toc();return}
 if(i=='b'){v.innerHTML=`<h2>Bibliography</h2><p>Verified sources only; historical works (1978–1998) first, with modern textbooks for further reading.</p>`+BIB.map(b=>`<div class="card">${b[0]} ${b[1]?`<a href="${b[1]}" target="_blank" rel="noopener" style="color:var(--ac)">DOI</a>`:''}</div>`).join('');toc();return}
 const c=C[i];v.innerHTML=`<small style="color:var(--mu);font-family:Inter">${PT[c[0]]} · Chapter ${i+1}</small><h2>${c[1]}</h2><span class="b ${c[2]}">${SL[c[2]]}</span><p>${link(c[3])}</p>${c[4]?`<div class="eq">${c[4]}</div>`:''}<div id="lab"></div><div id="qz"></div><div class="row"><button id="bm">${S.bm[i]?'★ Bookmarked':'☆ Bookmark'}</button><button id="dn">${S.done[i]?'✓ Completed':'Mark complete'}</button><button id="pv" ${i?'':'disabled'}>← Previous</button><button id="nx" ${i<22?'':'disabled'}>Next →</button></div>`;
 $('#bm').onclick=()=>{S.bm[i]=!S.bm[i];save();show(i)};$('#dn').onclick=()=>{S.done[i]=!S.done[i];save();show(i)};$('#pv').onclick=()=>show(i-1);$('#nx').onclick=()=>show(i+1);
 if(i==5||i==7)cube(i==5?3:4);if(i==12)compact();if(Q[i])quiz(i);toc();
 $('#prog').style.width=Object.keys(S.done).length/23*100+'%'}
function quiz(i){const q=Q[i],r=S.quiz[i];$('#qz').innerHTML=`<div class="card"><b>Check your understanding</b><p>${q.q}</p>${q.o.map((o,k)=>`<label style="display:block;color:var(--tx)"><input type=radio name=a value=${k}> ${o}</label>`).join('')}<div class="row"><button id="sb">Submit</button><span id="fb">${r!=null?'Last result: '+(r?'correct':'incorrect'):''}</span></div></div>`;
 $('#sb').onclick=()=>{const s=document.querySelector('input[name=a]:checked');if(!s)return;const ok=+s.value==q.a;S.quiz[i]=ok;save();$('#fb').innerHTML=`<span class="${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</span> ${q.w}`}}
function cube(n0){let n=n0,A=[.4,.3,0,.5,.2,.1],auto=1,lb=0;const L=$('#lab');L.innerHTML=`<div class="card"><b>Dimensional evolution &amp; tesseract laboratory</b><div class="row" id="ns">${[0,1,2,3,4].map(k=>`<button data-n="${k}">${['Point','Line','Square','Cube','Tesseract'][k]}</button>`).join('')}</div><canvas id="cv" width="520" height="360"></canvas><div id="inf"></div>${['XY','XZ','YZ','XW','YW','ZW'].map((p,k)=>`<div class="row"><label style="width:34px">${p}</label><input type=range min=0 max=6.28 step=.01 value=${A[k]} data-k="${k}"></div>`).join('')}<div class="row"><label><input type=checkbox id="au" checked> auto-rotate</label><label><input type=checkbox id="lbc"> vertex labels</label></div><small style="color:var(--mu)">A 3D→2D projection of a 4D object is a shadow, not the complete object. Edges that look crossing do not intersect in 4D.</small></div>`;
 L.querySelectorAll('[data-k]').forEach(s=>s.oninput=()=>A[s.dataset.k]=+s.value);$('#ns').onclick=e=>{if(e.target.dataset.n!=null)n=+e.target.dataset.n};$('#au').onchange=e=>auto=e.target.checked;$('#lbc').onchange=e=>lb=e.target.checked;
 const P=[[0,1],[0,2],[1,2],[0,3],[1,3],[2,3]],cv=$('#cv'),g=cv.getContext('2d');
 (function f(){raf=requestAnimationFrame(f);if(auto){A[0]+=.004;A[3]+=.006;A[5]+=.003;L.querySelectorAll('[data-k]').forEach(s=>s.value=A[s.dataset.k]%6.28)}
 const N=1<<n,V=[],E=[];for(let i=0;i<N;i++){let v=[0,0,0,0];for(let b=0;b<n;b++)v[b]=i>>b&1?1:-1;P.forEach(([a,b],k)=>{const c=Math.cos(A[k]),s=Math.sin(A[k]),x=v[a],y=v[b];v[a]=x*c-y*s;v[b]=x*s+y*c});const k4=3/(3-v[3]),p=[v[0]*k4,v[1]*k4,v[2]*k4],s=150/(4-p[2]);V.push([260+p[0]*s,180+p[1]*s]);}
 for(let i=0;i<N;i++)for(let b=0;b<n;b++)if(!(i>>b&1))E.push([i,i|1<<b]);
 g.clearRect(0,0,520,360);g.strokeStyle='#4d7cff';g.lineWidth=1.5;E.forEach(([a,b])=>{g.beginPath();g.moveTo(...V[a]);g.lineTo(...V[b]);g.stroke()});g.font='11px Inter';V.forEach((p,i)=>{g.fillStyle='#9b6bff';g.beginPath();g.arc(p[0],p[1],3.5,0,7);g.fill();if(lb){g.fillStyle='#e6e9f5';g.fillText(i.toString(2).padStart(n,'0'),p[0]+5,p[1]-5)}});
 $('#inf').innerHTML=`<small>${n}-cube: ${N} vertices, ${E.length} edges, ${n>1?n*(n-1)/2*(1<<n-2):0} square faces${n==4?', 8 cubic cells':''}. Vertex coordinates are all (±1,…,±1).</small>`})()}
function compact(){const L=$('#lab');L.innerHTML=`<div class="card"><b>Compactification (conceptual illustration)</b><canvas id="cc" width="520" height="200"></canvas><div class="row"><label>Radius R</label><input type=range id="rr" min=2 max=40 value=14></div><div id="ci"></div><small style="color:var(--mu)">Illustrative only: not to scale. A large dimension (horizontal) with a tiny circle attached at each point; the circle size is the only parameter here.</small></div>`;
 const g=$('#cc').getContext('2d');function d(){const r=+$('#rr').value;g.clearRect(0,0,520,200);g.strokeStyle='#4d7cff';g.beginPath();g.moveTo(10,100);g.lineTo(510,100);g.stroke();g.strokeStyle='#9b6bff';for(let x=40;x<510;x+=50){g.beginPath();g.ellipse(x,100,r*.45,r,0,0,7);g.stroke()}$('#ci').innerHTML=`<small>Relative KK mass scale ∝ 1/R = ${(14/r).toFixed(2)} (×1 at R = 14). Smaller circle → heavier modes → harder to detect.</small>`}$('#rr').oninput=d;d()}
$('#q').oninput=e=>{const t=e.target.value.trim().toLowerCase();if(!t){show(cur);return}
 const r=[];C.forEach((c,i)=>{if((c[1]+c[3]).toLowerCase().includes(t))r.push(`<div class="card"><a data-i="${i}" style="cursor:pointer;color:var(--ac)">${i+1}. ${c[1]}</a></div>`)});G.forEach(g=>{if((g[0]+g[1]).toLowerCase().includes(t))r.push(`<div class="card"><b>${g[0]}</b> — ${g[1]}</div>`)});
 cancelAnimationFrame(raf);$('#v').innerHTML=`<h2>Search: ${esc(t)}</h2>`+(r.join('')||'<p>No results.</p>');$('#v').querySelectorAll('[data-i]').forEach(a=>a.onclick=()=>{$('#q').value='';show(+a.dataset.i)})};
show(0);
</script></body></html>
